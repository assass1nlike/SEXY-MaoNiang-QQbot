[project]
name = "qq-auto-reply-bot"
version = "0.1.0"
description = "A QQ group bot that replies to configured users through a Responses-compatible API."
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.4.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.nonebot]
plugin_dirs = ["plugins"]
